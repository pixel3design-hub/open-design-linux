name: Build Open Design Linux packages

# Builds installable x86_64 RPM and DEB packages from upstream
# nexu-io/open-design and publishes each build as a release tagged v<VERSION>
# in this repository.
#
# Triggers:
#   - push to main (builds only if that version has no release yet)
#   - daily schedule: checks upstream for a new release tag and builds only that
#   - manual: pin a specific upstream tag/branch, or force a rebuild
#
# The upstream pin is not hardcoded: the newest `open-design-v<semver>` tag is
# resolved automatically. Something changing in the upstream packaging files will
# make `git apply` fail loudly (notification) — regenerate
# patches/open-design-linux-pack.patch against the new tag then.
#
# Only packages are produced: the upstream recipe runs with `--to dir` (no
# AppImage), and electron-builder's own rpm/deb targets package that tree.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch (empty = newest upstream release tag)"
        required: false
        default: ""
      force:
        description: "Rebuild even if a release for that version already exists"
        type: boolean
        required: false
        default: false
  schedule:
    # Daily at 04:00 UTC — version check only: builds when a new upstream
    # release tag has no release in this repository yet.
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-linux
  cancel-in-progress: true

env:
  UPSTREAM_REPO: nexu-io/open-design
  # Upstream point releases known to be broken: never build these.
  UPSTREAM_SKIP: "0.26.1"
  NAMESPACE: linux

jobs:
  # Resolves which upstream tag to build and whether there is anything to do.
  # `skip=true` when the tag is blacklisted or its release already exists, so a
  # scheduled run with no new upstream version costs a few seconds and no build.
  resolve:
    name: Resolve upstream version
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve upstream ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so pin gh to this repository explicitly.
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          ref="${UPSTREAM_REF:-}"
          if [[ -z "$ref" ]]; then
            ref="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'open-design-v*' \
              | awk -F'refs/tags/' '{print $2}' \
              | grep -E '^open-design-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          fi
          [[ -n "$ref" ]] || { echo "::error::no upstream release tag found"; exit 1; }
          version="${ref#open-design-v}"
          skip=false
          if [[ " ${UPSTREAM_SKIP:-} " == *" ${version} "* ]]; then
            echo "::notice::$version is skipped (UPSTREAM_SKIP)"
            skip=true
          elif [[ "$FORCE" != "true" ]] && gh release view "v${version}" >/dev/null 2>&1; then
            echo "::notice::release v${version} already exists"
            skip=true
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref (version $version, skip=$skip)"

  build:
    name: Build linux x64 packages
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1

      - name: Checkout CI repo (patches)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
          path: _ci

      # Upstream's assembled-app production install resolves transitive
      # @open-design/* deps from the npm registry (they are not published) and
      # blocks native build scripts. This patch makes tools-pack write a
      # pnpm-workspace.yaml into the assembled app pinning internal packages to
      # their packed tarballs and allowing native builds. Fails loudly when a new
      # upstream tag changes those files; regenerate it against that tag then.
      - name: Apply packaging patch
        run: |
          git apply --verbose _ci/patches/open-design-linux-pack.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Use a store inside the workspace: the containerized build resolves its
      # default pnpm store to /project/.pnpm-store, so a host install from the
      # same store keeps node_modules valid inside the container instead of
      # triggering the (TTY-blocked) node_modules purge prompt.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # The inner `bash -lc` in the container sources this profile. CI=true
      # makes pnpm non-interactive if it ever needs to relink node_modules
      # (otherwise it aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      # npm_execpath points at the standalone pnpm binary so nested pnpm calls
      # from tools-pack skip `corepack`, which the electronuserland image strips.
      # /tmp on PATH lets electron-builder's node-module collector find `pnpm`
      # (the standalone binary lives at /tmp/pnpm).
      - name: Pre-seed container profile
        run: |
          mkdir -p "$RUNNER_TEMP/tools-pack/.docker-home"
          printf 'export CI=true\nexport PNPM_HOME=/tmp/pnpm-home\nexport npm_execpath=/tmp/pnpm\nexport PATH="/tmp:$PATH"\n' \
            > "$RUNNER_TEMP/tools-pack/.docker-home/.bash_profile"

      # `--to dir` stops at the unpacked tree: no AppImage is built or thrown
      # away, the rpm/deb targets below consume linux-unpacked directly. The
      # containerized lane keeps the payload glibc-compatible for older distros.
      - name: Build unpacked app
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec tools-pack linux build \
            --dir "$RUNNER_TEMP/tools-pack" \
            --namespace "$NAMESPACE" \
            --portable \
            --app-version "$VERSION" \
            --to dir \
            --containerized \
            --require-vela-cli \
            --json 2>&1 | tee "$RUNNER_TEMP/tools-pack-build.log"

      # RPM + DEB: electron-builder's own targets (fpm -> rpmbuild / dpkg-deb)
      # applied to the already assembled tree. Only the targets run, nothing is
      # re-packed. `rpm` supplies rpmbuild; dpkg-deb comes with the runner.
      - name: Build RPM and DEB
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # imagemagick supplies convert for the icon set (not preinstalled on
          # the current runner images); rpm supplies rpmbuild.
          sudo apt-get install -y -qq rpm imagemagick
          unpacked="$(find "$RUNNER_TEMP/tools-pack" -type d -name linux-unpacked | head -n 1)"
          [[ -n "$unpacked" ]] || { echo "linux-unpacked not found" >&2; exit 1; }
          # Prune what a linux x64 package never uses (extra UI locales, non-x64
          # native blobs, source maps) so the payload stays small.
          find "$unpacked/locales" -type f ! -name 'en-US.pak' -delete
          find "$unpacked/resources/app/node_modules" -type f -name '*.map' -delete
          ort="$unpacked/resources/app/node_modules/onnxruntime-node/bin/napi-v3"
          if [[ -d "$ort" ]]; then
            find "$ort" -mindepth 2 -maxdepth 2 -type d ! -path '*/linux/x64' -exec rm -rf {} +
            find "$ort" -mindepth 1 -maxdepth 1 -type d -empty -delete
          fi
          # Canonical Linux id. Upstream's own Linux recipe uses `open-design`
          # (iconFileName in tools/pack/src/linux.ts), while the assembled tree
          # names the binary after the product ("Open Design"). electron-builder
          # derives the desktop file name, Icon= and the packaged binary path
          # from executableName, so rename here and let all of them agree.
          mv "$unpacked/Open Design" "$unpacked/open-design"
          # hicolor/index.theme only declares 16..512, so a single 1024px icon is
          # invisible to every icon theme: blank menu icon, and a blank taskbar
          # icon as well (Electron ignores BrowserWindow.icon on Wayland, KWin
          # resolves the running app through this entry's Icon=). Ship the
          # standard sizes instead.
          icons="$RUNNER_TEMP/icons"
          mkdir -p "$icons"
          for size in 16 24 32 48 64 128 256 512; do
            convert "$GITHUB_WORKSPACE/tools/pack/resources/linux/icon.png" \
              -resize "${size}x${size}" "$icons/${size}x${size}.png"
          done
          electron_version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron")"
          export VERSION ELECTRON_VERSION="$electron_version"
          # electron-builder refuses to run from a package.json that lists it in
          # "dependencies", so build from a throwaway metadata-only package that
          # carries the whole electron-builder config (arrays do not survive the
          # `-c.x.0=` CLI form).
          work="$RUNNER_TEMP/pkg-work"
          mkdir -p "$work" dist
          PKG_OUT="$work/package.json" node -e '
            const fs = require("fs");
            const cfg = {
              name: "open-design",
              productName: "Open Design",
              version: process.env.VERSION,
              description: "Open Design desktop app",
              author: "Open Design Contributors",
              license: "Apache-2.0",
              homepage: `https://github.com/${process.env.GITHUB_REPOSITORY}`,
              build: {
                appId: "io.open-design.desktop",
                electronVersion: process.env.ELECTRON_VERSION,
                artifactName: "Open-Design-linux-x64.${ext}",
                compression: "maximum",
                linux: {
                  executableName: "open-design",
                  // A design tool, so Graphics rather than the upstream
                  // AppImage entry (Development/Utility).
                  category: "Graphics",
                  synopsis: "Open Design",
                  maintainer: "Open Design Contributors",
                  icon: `${process.env.RUNNER_TEMP}/icons`,
                  desktop: {
                    entry: {
                      Name: "Open Design",
                      GenericName: "Design Tool",
                      Comment: "Open Design desktop app",
                      Keywords: "design;graphics;ui;vector;prototype;",
                      StartupNotify: "true",
                      // Must match Electron'"'"'s WM_CLASS, which is the product
                      // name rather than the executable name: KWin associates
                      // the running window with this entry through it.
                      StartupWMClass: "Open Design",
                      MimeType: "x-scheme-handler/od;",
                    },
                  },
                },
                // Debian 12/Ubuntu 22.04 ship libgtk-3-0, Ubuntu 24.04+ only
                // libgtk-3-0t64: offer both instead of breaking apt install.
                deb: {
                  depends: [
                    "libgtk-3-0 | libgtk-3-0t64",
                    "libnotify4",
                    "libnss3",
                    "libxss1",
                    "libxtst6",
                    "xdg-utils",
                    "libatspi2.0-0",
                    "libuuid1",
                    "libsecret-1-0",
                  ],
                },
              },
            };
            fs.writeFileSync(process.env.PKG_OUT, JSON.stringify(cfg, null, 2) + "\n");
          '
          cd "$work"
          "$GITHUB_WORKSPACE/tools/pack/node_modules/.bin/electron-builder" --linux rpm deb \
            --prepackaged "$unpacked" \
            -c.directories.output="$GITHUB_WORKSPACE/dist"
          ls -lh "$GITHUB_WORKSPACE/dist"

      # Guard the metadata that was silently wrong in the last releases: icon
      # sizes missing from the theme index, a non-canonical desktop id, and the
      # Development category. Fail here instead of shipping it again.
      - name: Verify package metadata
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pkgcheck"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/pkgcheck"
          desktop="$RUNNER_TEMP/pkgcheck/usr/share/applications/open-design.desktop"
          test -f "$desktop" || { echo "missing open-design.desktop" >&2; exit 1; }
          for expected in \
            "Name=Open Design" \
            "Icon=open-design" \
            "StartupWMClass=Open Design" \
            "Categories=Graphics;" \
            "StartupNotify=true" \
            "MimeType=x-scheme-handler/od;"; do
            grep -qx "$expected" "$desktop" || { echo "desktop entry lacks: $expected" >&2; exit 1; }
          done
          grep -q '^Exec="/opt/Open Design/open-design"' "$desktop" || {
            echo "desktop Exec does not point at the canonical binary" >&2; exit 1; }
          for size in 16 24 32 48 64 128 256 512; do
            test -f "$RUNNER_TEMP/pkgcheck/usr/share/icons/hicolor/${size}x${size}/apps/open-design.png" || {
              echo "missing ${size}x${size} icon" >&2; exit 1; }
          done
          test -x "$RUNNER_TEMP/pkgcheck/opt/Open Design/open-design"
          rpm -qpl dist/*.rpm | grep -qx "/usr/share/applications/open-design.desktop"
          rpm -qpl dist/*.rpm | grep -qx "/usr/share/icons/hicolor/48x48/apps/open-design.png"
          echo "package metadata OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Design-linux-x64-${{ needs.resolve.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # One release per upstream version, tagged v<VERSION>: the tag is the
      # release tag, so `releases/latest/download/<asset>` always resolves to
      # the newest build. Re-running the same version re-uploads (--clobber).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout's git remote points at the upstream repo; pin gh to
          # this repository for release operations.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # The old rolling release only ever carried the rpm; drop it once so
          # releases/latest points at the versioned one.
          gh release delete "linux-latest" --yes --cleanup-tag || true
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --latest
            # Re-uploading keeps the old tag, so a forced rebuild would leave
            # the release pointing at the commit that produced the previous
            # assets. Move the tag onto this build commit (the assets in the
            # release are the ones this run just built).
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Open Design Linux $VERSION" \
              --notes "Automated Linux (x64) packages of [upstream $REF](https://github.com/${UPSTREAM_REPO}/releases/tag/${REF}).

            - RPM: \`Open-Design-linux-x64.rpm\` — \`sudo dnf install ./Open-Design-linux-x64.rpm\` (Fedora/RHEL/openSUSE)
            - DEB: \`Open-Design-linux-x64.deb\` — \`sudo apt install ./Open-Design-linux-x64.deb\` (Debian/Ubuntu)
            - Both install the package \`open-design\` to \`/opt/Open Design\` with a menu entry.
            - Bundles the Vela CLI, so cloud login works out of the box.
            - Non-x64 runtime blobs, extra UI locales, and source maps are pruned to keep the download small."
          fi

  # Failure notification: one Telegram message (secrets-based). GitHub already
  # emails whoever triggered the failed run (Settings -> Notifications -> Actions),
  # so no SMTP action is needed.
  notify:
    name: Notify on failure
    needs: [resolve, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.resolve.outputs.version || 'unknown' }}
          REF: ${{ needs.resolve.outputs.ref || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi
          text="Open Design Linux build failed: ${VERSION} (${REF}) - ${RUN_URL}"
          curl -fsS --retry 3 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -o /dev/null
          echo "Notification sent"
