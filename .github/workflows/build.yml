name: Build Open Design RPM

# Builds an installable x86_64 RPM from upstream nexu-io/open-design and
# publishes it on a rolling "linux-latest" release in this repository.
#
# Triggers:
#   - manual (optionally pinning a different upstream tag/branch)
#   - daily schedule, rebuilding the pinned upstream ref (UPSTREAM_REF_DEFAULT)
#
# Pinned on purpose: upstream 0.26.1 is broken, so the default is 0.26.0.
# Bump UPSTREAM_REF_DEFAULT (or pass upstream_ref) once a good release exists.
#
# Only the RPM is produced: the upstream recipe runs with `--to dir` (no
# AppImage), and electron-builder's own rpm target packages that tree.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag or branch (empty = pinned default, see env)"
        required: false
        default: ""
  schedule:
    # Daily at 04:00 UTC — rebuilds the pinned ref (keeps the release fresh).
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-linux
  cancel-in-progress: true

env:
  UPSTREAM_REPO: nexu-io/open-design
  # ponytail: hardcoded pin — upstream 0.26.1 is broken. Bump this when a
  # fixed release lands.
  UPSTREAM_REF_DEFAULT: open-design-v0.26.0
  RELEASE_TAG: linux-latest
  NAMESPACE: linux

jobs:
  build:
    name: Build linux x64 RPM
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream ref
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$UPSTREAM_REF" ]]; then
            ref="$UPSTREAM_REF"
          else
            ref="${UPSTREAM_REF_DEFAULT:?UPSTREAM_REF_DEFAULT must be set}"
          fi
          version="${ref#open-design-v}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building upstream ref: $ref (version $version)"

      - name: Checkout upstream source
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1

      - name: Checkout CI repo (patches)
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ github.repository }}
          path: _ci

      # Upstream's assembled-app production install resolves transitive
      # @open-design/* deps from the npm registry (they are not published) and
      # blocks native build scripts. This patch makes tools-pack write a
      # pnpm-workspace.yaml into the assembled app pinning internal packages to
      # their packed tarballs and allowing native builds. Re-generate against a
      # new upstream tag with: patches/open-design-linux-pack.patch
      - name: Apply packaging patch
        run: |
          git apply --verbose _ci/patches/open-design-linux-pack.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Use a store inside the workspace: the containerized build resolves its
      # default pnpm store to /project/.pnpm-store, so a host install from the
      # same store keeps node_modules valid inside the container instead of
      # triggering the (TTY-blocked) node_modules purge prompt.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir "$GITHUB_WORKSPACE/.pnpm-store"

      # The inner `bash -lc` in the container sources this profile. CI=true
      # makes pnpm non-interactive if it ever needs to relink node_modules
      # (otherwise it aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
      # npm_execpath points at the standalone pnpm binary so nested pnpm calls
      # from tools-pack skip `corepack`, which the electronuserland image strips.
      # /tmp on PATH lets electron-builder's node-module collector find `pnpm`
      # (the standalone binary lives at /tmp/pnpm).
      - name: Pre-seed container profile
        run: |
          mkdir -p "$RUNNER_TEMP/tools-pack/.docker-home"
          printf 'export CI=true\nexport PNPM_HOME=/tmp/pnpm-home\nexport npm_execpath=/tmp/pnpm\nexport PATH="/tmp:$PATH"\n' \
            > "$RUNNER_TEMP/tools-pack/.docker-home/.bash_profile"

      # `--to dir` stops at the unpacked tree: no AppImage is built or thrown
      # away, the rpm target below consumes linux-unpacked directly. The
      # containerized lane keeps the payload glibc-compatible for older distros.
      - name: Build unpacked app
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          pnpm exec tools-pack linux build \
            --dir "$RUNNER_TEMP/tools-pack" \
            --namespace "$NAMESPACE" \
            --portable \
            --app-version "$VERSION" \
            --to dir \
            --containerized \
            --require-vela-cli \
            --json 2>&1 | tee "$RUNNER_TEMP/tools-pack-build.log"

      # RPM: electron-builder's own rpm target (fpm -> rpmbuild) applied to the
      # already assembled tree. Only the target runs, nothing is re-packed.
      # The `rpm` package supplies rpmbuild.
      - name: Build RPM
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          unpacked="$(find "$RUNNER_TEMP/tools-pack" -type d -name linux-unpacked | head -n 1)"
          [[ -n "$unpacked" ]] || { echo "linux-unpacked not found" >&2; exit 1; }
          # Prune what a linux x64 package never uses (extra UI locales, non-x64
          # native blobs, source maps) so the payload stays small.
          find "$unpacked/locales" -type f ! -name 'en-US.pak' -delete
          find "$unpacked/resources/app/node_modules" -type f -name '*.map' -delete
          ort="$unpacked/resources/app/node_modules/onnxruntime-node/bin/napi-v3"
          if [[ -d "$ort" ]]; then
            find "$ort" -mindepth 2 -maxdepth 2 -type d ! -path '*/linux/x64' -exec rm -rf {} +
            find "$ort" -mindepth 1 -maxdepth 1 -type d -empty -delete
          fi
          electron_version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron")"
          # electron-builder refuses to run from a package.json that lists it in
          # "dependencies", so build from a throwaway metadata-only package.
          work="$RUNNER_TEMP/rpm-work"
          mkdir -p "$work" dist
          printf '%s\n' \
            "{\"name\":\"open-design\",\"productName\":\"Open Design\",\"version\":\"${VERSION}\",\"description\":\"Open Design desktop app\",\"author\":\"Open Design Contributors\",\"license\":\"Apache-2.0\",\"homepage\":\"https://github.com/${GITHUB_REPOSITORY}\"}" \
            > "$work/package.json"
          cd "$work"
          "$GITHUB_WORKSPACE/tools/pack/node_modules/.bin/electron-builder" --linux rpm \
            --prepackaged "$unpacked" \
            -c.directories.output="$GITHUB_WORKSPACE/dist" \
            -c.electronVersion="$electron_version" \
            -c.appId=io.open-design.desktop \
            -c.artifactName='Open-Design-linux-x64.${ext}' \
            -c.linux.executableName="Open Design" \
            -c.linux.category=Development \
            -c.linux.synopsis="Open Design" \
            -c.linux.maintainer="Open Design Contributors" \
            -c.linux.desktop.entry.MimeType='x-scheme-handler/od;' \
            -c.linux.icon="$GITHUB_WORKSPACE/tools/pack/resources/linux/icon.png" \
            -c.compression=maximum
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-Design-linux-x64-${{ steps.ref.outputs.version }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          # The checkout's git remote points at the upstream repo; pin gh to
          # this repository for release operations.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ref.outputs.version }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" dist/* \
            --title "Open Design Linux $VERSION" \
            --notes "Automated Linux (x64) RPM build of [upstream $REF](https://github.com/${UPSTREAM_REPO}/releases/tag/${REF}).

          - RPM: \`Open-Design-linux-x64.rpm\` — install with \`sudo dnf install ./Open-Design-linux-x64.rpm\` (Fedora/RHEL/openSUSE)
          - Installs to \`/opt/Open Design\` with a menu entry; remove with \`sudo dnf remove open-design\`.
          - Bundles the Vela CLI, so cloud login works out of the box.
          - Non-x64 runtime blobs, extra UI locales, and source maps are pruned to keep the download small."
