# Flatpak manifest for the AppImage this repo builds.
#
# The AppImage is unpacked into squashfs-root/ next to this file and copied
# verbatim into /app, so the bundle ships exactly the tree the AppImage does.
# No SDK build tools are involved: this is a repack, not a compile.
#
# Build (or use the workflow, which does this for you):
#   cd flatpak
#   /path/to/Open-Design-linux-x64.AppImage --appimage-extract
#   cp ../../tools/pack/resources/linux/icon.png icon.png   # from upstream source
#   flatpak-builder --user --force-clean --repo=repo build io.github.pixel3design_hub.OpenDesign.yml
#   flatpak build-bundle repo Open-Design-linux-x64.flatpak io.github.pixel3design_hub.OpenDesign
app-id: io.github.pixel3design_hub.OpenDesign
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: open-design

finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland

modules:
  - name: open-design
    buildsystem: simple
    build-commands:
      # `type: dir` sources are merged into the build root, so the extracted
      # AppImage tree is already spread over `.` here.
      - mkdir -p /app/open-design
      - cp -a . /app/open-design/
      - rm -f /app/open-design/open-design.sh
      - rm -f /app/open-design/io.github.pixel3design_hub.OpenDesign.desktop /app/open-design/icon.png
      - install -Dm755 open-design.sh /app/bin/open-design
      - install -Dm644 io.github.pixel3design_hub.OpenDesign.desktop
        /app/share/applications/io.github.pixel3design_hub.OpenDesign.desktop
      - install -Dm644 icon.png
        /app/share/icons/hicolor/512x512/apps/io.github.pixel3design_hub.OpenDesign.png
    sources:
      - type: dir
        path: squashfs-root
      - type: file
        path: open-design.sh
      - type: file
        path: io.github.pixel3design_hub.OpenDesign.desktop
      - type: file
        path: icon.png
